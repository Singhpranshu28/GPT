name: Release APK

# Every push to main publishes the APK as the newest GitHub Release, so
# https://github.com/Singhpranshu28/GPT/releases/latest/download/flow-notes.apk
# always downloads the latest build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk flow-notes.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flow Notes build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: flow-notes.apk
          body: |
            Install on Android: download `flow-notes.apk` below on your phone and open it
            (allow "Install unknown apps" for your browser when asked).
            Built from ${{ github.sha }}.
